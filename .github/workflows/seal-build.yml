name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Compile check
        run: GO111MODULE=off go build -v .

      - name: Pack module zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/packer" "$RUNNER_TEMP/out"

          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/modsrc/"
          rm -rf "$RUNNER_TEMP/modsrc/.git"
          rm -f "$RUNNER_TEMP/modsrc/.github/workflows/seal-build.yml"
          if [ -d "$RUNNER_TEMP/modsrc/.github" ]; then
            find "$RUNNER_TEMP/modsrc/.github" -type d -empty -delete
          fi

          cat > "$RUNNER_TEMP/packer/main.go" <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              if len(os.Args) != 5 {
                  log.Fatalf("usage: %s <module-path> <version> <src-dir> <out-zip>", os.Args[0])
              }
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF

          cd "$RUNNER_TEMP/packer"
          go mod init example.com/packer
          go get golang.org/x/mod@v0.14.0
          go run . github.com/Masterminds/goutils v1.1.0 "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/out/v1.1.0.zip"

          unzip -l "$RUNNER_TEMP/out/v1.1.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: v1.1.0.zip
          path: ${{ runner.temp }}/out/v1.1.0.zip
          if-no-files-found: error
